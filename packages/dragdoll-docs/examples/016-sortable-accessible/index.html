<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sortable List - Accessible</title>
    <meta
      name="description"
      content="A sortable list with pointer drag and an accessible keyboard reordering flow with live region announcements."
    />
    <meta
      name="viewport"
      content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="dnd-instructions" class="sr-only">
      Press Shift plus Space or Shift plus Enter to reorder. Use arrow keys to move. Press Space or
      Enter to drop, or Escape to cancel.
    </div>
    <div
      id="dnd-live-region"
      class="sr-only"
      role="status"
      aria-live="assertive"
      aria-atomic="true"
    ></div>
    <ul id="sortable-list" role="list" aria-label="Sortable items"></ul>
    <script type="module" src="index.ts"></script>
  </body>
</html>
